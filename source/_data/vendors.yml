bytehosty:
  name: "ByteHosty"
  website: "https://bytehosty.com/"
  intro_zh: "ByteHosty(bytehosty.com, AS203446)提供美国等地的 KVM VPS。"
  intro_en: "ByteHosty (bytehosty.com, AS203446) offers KVM VPS services in the United States and other locations."
xeniahosting:
  name: "XeniaHosting"
  website: "https://xeniahosting.com/"
  intro_zh: "XeniaHosting(xeniahosting.com, AS213791)是意大利等地的主机商,提供 VPS Eco 等云服务器。"
  intro_en: "XeniaHosting (xeniahosting.com, AS213791) is a hosting provider offering VPS Eco and other cloud servers in Italy and elsewhere."
kainode:
  name: "Kainode"
  website: "https://kainode.com/"
  intro_zh: "Kainode(kainode.com, AS200257)提供新加坡等地的 KVM VPS,运营方为 UserDepth LLC。"
  intro_en: "Kainode (kainode.com, AS200257) offers Singapore KVM VPS; it is operated by UserDepth LLC."
servury:
  name: "Servury"
  website: "https://servury.com/"
  intro_zh: "Servury(servury.com)提供注重隐私的匿名 VPS / VDS,机房分布在多个地区。"
  intro_en: "Servury (servury.com) offers privacy-focused anonymous VPS and VDS in multiple locations."
netdynamics:
  name: "NetDynamics"
  website: "https://netdynamics24.com/"
  intro_zh: "NetDynamics(netdynamics24.com)是美国新墨西哥州注册的 NetDynamics LLC,提供独立服务器、存储服务器与备份存储。"
  intro_en: "NetDynamics (netdynamics24.com) is NetDynamics LLC, registered in New Mexico, USA, offering dedicated servers, storage servers and backup storage."
cstserver:
  name: "CSTserver"
  website: "https://cstserver.com/"
  intro_zh: "CSTserver(cstserver.com)主营独立服务器与裸金属,也提供云服务器,机房覆盖香港、美国、日本、德国等地。"
  intro_en: "CSTserver (cstserver.com) focuses on dedicated and bare-metal servers and also sells cloud servers, with locations in Hong Kong, the US, Japan, Germany and more."
paradisehosting:
  name: "Paradise Hosting"
  website: "https://paradisehosting.xyz/"
  intro_zh: "Paradise Hosting(paradisehosting.xyz)是 2026 年成立、在美国密歇根州注册的 Paradise Hosting LLC,在纽约州水牛城自有服务器,提供 VPS、独立服务器、托管与游戏服务器。"
  intro_en: "Paradise Hosting (paradisehosting.xyz) is Paradise Hosting LLC, a Michigan-registered company founded in 2026 that runs its own servers in Buffalo, New York, offering VPS, dedicated servers, colocation and game servers."
felware:
  name: "Felware"
  website: "https://felware.net/"
  intro_zh: "Felware(felware.net,Felware LLC)在美国威斯康星州麦迪逊运营自有机房,专注独立服务器(裸金属)与托管业务。"
  intro_en: "Felware (felware.net, Felware LLC) runs its own data center in Madison, Wisconsin, USA, focusing on bare-metal dedicated servers and colocation."
isvoro:
  name: "Isvoro"
  website: "https://isvoro.com/"
  intro_zh: "Isvoro(isvoro.com)是云主机平台,提供香港、日本、美国洛杉矶、德国等多地区 VPS 与独立服务器,付款后自动开通。"
  intro_en: "Isvoro (isvoro.com) is a cloud hosting platform offering VPS and dedicated servers in Hong Kong, Japan, Los Angeles, Germany and other regions, with automatic provisioning after payment."
smokyhosts:
  name: "SmokyHosts"
  website: "https://smokyhosts.com/"
  intro_zh: "SmokyHosts(smokyhosts.com)是印度注册的 IT 服务公司,2004 年起提供虚拟主机、经销商主机与 VPS,VPS 机房覆盖美国堪萨斯城、水牛城、洛杉矶等地。"
  intro_en: "SmokyHosts (smokyhosts.com) is an India-registered IT services company that has offered web hosting, reseller hosting and VPS since 2004, with VPS locations including Kansas City, Buffalo and Los Angeles in the US."
pqs:
  name: "PQS"
  website: "https://www.pqs.pw/"
  intro_zh: "PQS(pqs.pw)主营台湾原生 IP VDS(台北、彰化 HiNet 商宽/家宽),另有日本 CN2、香港等产品,主打不限流量与流媒体/AI 解锁。"
  intro_en: "PQS (pqs.pw) focuses on Taiwan native-IP VDS (Taipei, Changhua HiNet business/residential lines) plus Japan CN2 and Hong Kong products, emphasizing unmetered traffic and streaming/AI unlocking."
prepaid-host:
  name: "Prepaid-Host"
  website: "https://prepaid-host.com/"
  intro_zh: "Prepaid-Host(prepaid-host.com)是德国法兰克福的预付费主机商,提供 AMD EPYC KVM 根服务器、存储服务器、S3 对象存储、网站与游戏服务器托管,上游 SYNLINQ(AS44486),全线含 DDoS 防护。"
  intro_en: "Prepaid-Host (prepaid-host.com) is a Frankfurt, Germany based prepaid host offering AMD EPYC KVM root servers, storage servers, S3 object storage, web hosting and game servers, with SYNLINQ (AS44486) uplinks and DDoS protection included."
st-hosting:
  name: "ST-Hosting"
  website: "https://www.st-hosting.com/"
  intro_zh: "ST-Hosting 是德国 NUXOA GmbH 旗下面向个人用户的品牌,在法兰克福、纽伦堡提供 LXC/KVM VPS、独立服务器、虚拟主机与域名。"
  intro_en: "ST-Hosting is the consumer brand of Germany's NUXOA GmbH, offering LXC/KVM VPS, dedicated servers, web hosting and domains in Frankfurt and Nuremberg."
fourplex:
  name: "Fourplex"
  website: "https://www.fourplex.net/"
  intro_zh: "Fourplex Telecom LLC 是美国纽约的主机商,提供基于 AMD Ryzen 的 KVM VPS 与存储 VPS,机房位于 Metanet NYC,网络为 10Gbps,上游 Cogent/GTT。"
  intro_en: "Fourplex Telecom LLC is a New York based provider offering AMD Ryzen KVM VPS and storage VPS in the Metanet NYC facility, with a 10Gbps network and Cogent/GTT upstream."
vpspioneer:
  name: "VPSPioneer"
  website: "https://vpspioneer.com/"
  intro_zh: "VPSPioneer 由英国注册公司 VPSPIONEER LTD(No. 16893138)运营,在法国和土耳其布尔萨提供 KVM VPS 与虚拟主机,含每日快照与 30 天退款。"
  intro_en: "VPSPioneer is operated by VPSPIONEER LTD (England and Wales No. 16893138) and offers KVM VPS and web hosting in France and Bursa, Türkiye, with daily snapshots and a 30-day money-back guarantee."
